  html = new TextDecoder('utf-8').decode(bytes);
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  document.getElementById(frameId).src = URL.createObjectURL(blob);
}

loadView('view1', 'frame1');
loadView('view2', 'frame2');

document.querySelectorAll('.tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    var target = tab.dataset.target;
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
    document.querySelectorAll('.frame-container iframe').forEach(function(f) { f.classList.remove('active'); });
    var frame = document.getElementById(target);
    frame.classList.add('active');
    setTimeout(function() {
      try { frame.contentWindow.dispatchEvent(new Event('resize')); } catch(e) {}
    }, 50);
  });
});
</script>
