<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>温敏相变 PET 猝灭演示台</title>
<style>
:root{
  --bg:#c6d6e5;
  --surface:rgba(255,255,255,0.85);
  --surface-2:rgba(235,242,250,0.85);
  --border:rgba(80,120,170,0.35);
  --text:#1a2a3a; --text-dim:#5a6a7a;
  --accent:#2d6bcc; --green:#1f9d3e; --red:#ff3845; --warn:#ff9944; --cyan:#00a8c8;
  --mono:"Times New Roman","Microsoft YaHei","PingFang SC",serif;
}
*{margin:0; padding:0; box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  font-family:"Times New Roman","Microsoft YaHei","PingFang SC",serif;
  height:100vh; width:100vw; overflow:hidden;
  color:var(--text); display:flex; flex-direction:column;
  user-select:none; -webkit-font-smoothing:antialiased;
}

/* ---------- header ---------- */
#header{
  display:flex; align-items:center; gap:14px;
  padding:12px 24px; flex-shrink:0;
  background:linear-gradient(180deg, rgba(220,232,245,0.98), rgba(198,214,229,0.95));
  border-bottom:1px solid var(--border); z-index:10;
}
#header .icon-box{
  width:30px; height:30px; border-radius:6px;
  background:linear-gradient(135deg, #4d8bff, #7d6dff);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size:14px; flex-shrink:0;
}
#header h1{font-size:18px; font-weight:700; color:#000}
.h-right{margin-left:auto; display:flex; gap:8px; align-items:center}
/* ---------- main ---------- */
#main{flex:1; display:flex; min-height:0; padding:12px 24px; gap:16px}
#simCard{
  flex:1; min-width:0; position:relative;
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; overflow:hidden; display:flex; flex-direction:column;
}
.card-head{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:12px 16px; border-bottom:1px solid var(--border);
}
.card-head h3{font-size:17px; font-weight:700; color:var(--accent); letter-spacing:1px; display:flex; align-items:center; gap:9px}
.card-head h3::before{content:''; width:5px; height:17px; border-radius:2px; background:linear-gradient(180deg,#4d8bff,#7d6dff)}
.card-head small{margin-left:auto; font-size:11px; color:var(--text-dim); font-family:var(--mono)}
#sim{flex:1; width:100%; display:block; min-height:0; cursor:crosshair}

#info-panel{width:372px; flex-shrink:0; display:flex; flex-direction:column; gap:10px; min-height:0}
.panel{
  background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:16px 18px; transition:all 0.3s;
}
.panel h3{
  font-size:15px; color:var(--accent); text-transform:uppercase;
  letter-spacing:1.2px; margin-bottom:12px; font-weight:700;
  display:flex; align-items:center; justify-content:space-between;
}
.state-tag{font-size:12.5px; padding:4px 12px; border-radius:4px; font-weight:600; letter-spacing:0.5px}
.state-tag.ok{background:rgba(31,157,62,0.15); color:#1a8a38}
.state-tag.quench{background:rgba(255,56,69,0.15); color:#ff3845; animation:blinkTag 1s infinite}
@keyframes blinkTag{0%,100%{opacity:1}50%{opacity:.45}}
.panel-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:9px 0; font-size:16px; border-bottom:1px dashed rgba(100,140,200,0.18);
}
.panel-row:last-child{border-bottom:none}
.panel-row .label{color:var(--text-dim); font-size:14.5px}
.panel-row .value{font-weight:700; font-family:var(--mono); font-size:20px}
.v-green{color:var(--green)} .v-red{color:var(--red)} .v-blue{color:var(--accent)} .v-dim{color:var(--text-dim)}

#chartPanel{flex:0 0 250px; display:flex; flex-direction:column}
#chartPanel h3{margin-bottom:6px}
#chart{flex:1; width:100%; display:block; min-height:0}

/* ---------- DeepSeek 解答卡 ---------- */
.chat-card{flex:1; min-height:0; display:flex; flex-direction:column}
.chat-card .state-tag.ds{background:rgba(77,107,254,0.12); color:#4d6bfe; animation:none}
.chat{flex:1; min-height:0; overflow-y:auto; margin-top:4px; padding-right:3px}
.chat::-webkit-scrollbar{width:5px}
.chat::-webkit-scrollbar-thumb{background:rgba(77,107,254,.26); border-radius:3px}
.q{display:flex; justify-content:flex-end; margin-bottom:10px}
.qb{
  max-width:94%; font-size:14px; line-height:1.55; color:var(--text);
  background:rgba(45,107,204,.10); border:1px solid rgba(45,107,204,.22);
  border-radius:12px 12px 4px 12px; padding:7px 11px;
}
.a{display:flex; gap:8px; align-items:flex-start}
.ava{
  width:24px; height:24px; flex:0 0 24px; border-radius:7px; margin-top:1px;
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700;
  font-family:var(--mono); background:linear-gradient(135deg,#4d6bfe,#8aa2ff);
  box-shadow:0 3px 10px rgba(77,107,254,.3);
}
.ab{flex:1; min-width:0}
.ab .lead{font-size:14px; line-height:1.55; color:var(--text); font-weight:600}
.ab ul{list-style:none; margin-top:7px; display:flex; flex-direction:column; gap:6px}
.ab li{
  font-size:13.5px; line-height:1.55; color:var(--text-dim); padding-left:14px; position:relative;
  opacity:0; transform:translateY(5px); transition:opacity .3s, transform .3s;
}
.ab li.in{opacity:1; transform:none}
.ab li::before{
  content:""; position:absolute; left:0; top:7px; width:5px; height:5px; border-radius:50%;
  background:#4d6bfe;
}
.ab b{color:var(--text); font-weight:700}
.ab em{font-style:normal; color:#3a56e8; font-weight:700}
.think{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim); font-family:var(--mono)}
.think u{text-decoration:none; width:4px; height:4px; border-radius:50%; background:#4d6bfe; display:inline-block; animation:tb 1.1s infinite}
.think u:nth-child(2){animation-delay:.2s}
.think u:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{opacity:.25; transform:translateY(0)}30%{opacity:1; transform:translateY(-2px)}}

/* ---------- 底部深色控制台（同参考页 footer 风格） ---------- */
#console{
  flex-shrink:0; padding:16px 28px 18px;
  background:rgba(8,12,22,0.88); border-top:1px solid var(--border); z-index:10;
  display:flex; align-items:center; gap:26px;
}
.c-label{min-width:120px}
.c-label .k{font-family:var(--mono); font-size:9px; letter-spacing:2px; color:#7d92aa; margin-bottom:4px}
.c-label .v{font-family:var(--mono); font-size:27px; font-weight:700; color:#dce8f5; letter-spacing:-0.01em}
.c-label .v u{text-decoration:none; font-size:11px; color:#7d92aa; margin-left:3px}
.c-label .v.hot{color:#ff6b72; text-shadow:0 0 18px rgba(255,56,69,.55)}
.sliderWrap{flex:1; position:relative; padding-top:14px}
#tSlider{-webkit-appearance:none; width:100%; height:26px; background:transparent; cursor:pointer; outline:none; display:block}
#tSlider::-webkit-slider-runnable-track{
  height:6px; border-radius:4px;
  background:linear-gradient(90deg, #4d8bff 0%, #4d8bff var(--p,20%), rgba(255,255,255,.16) var(--p,20%));
}
#tSlider::-webkit-slider-thumb{
  -webkit-appearance:none; width:17px; height:17px; border-radius:50%; margin-top:-5.5px;
  background:#fff; border:2.5px solid #4d8bff; box-shadow:0 0 12px rgba(77,139,255,.8);
}
#tSlider::-moz-range-track{height:6px; border-radius:4px; background:rgba(255,255,255,.16)}
#tSlider::-moz-range-progress{height:6px; border-radius:4px; background:#4d8bff}
#tSlider::-moz-range-thumb{width:15px; height:15px; border:2.5px solid #4d8bff; background:#fff; border-radius:50%}
.lcstMark{position:absolute; top:2px; bottom:-6px; width:0; pointer-events:none; border-left:2px dashed #ff6b72; opacity:.9}
.lcstMark span{position:absolute; top:-13px; left:-30px; font-family:var(--mono); font-size:9px; color:#ff8a92; white-space:nowrap; letter-spacing:.5px}
.scaleRow{display:flex; justify-content:space-between; margin-top:7px; font-family:var(--mono); font-size:9px; color:#7d92aa}
.quick{display:flex; gap:8px; min-width:230px}
.qbtn{
  flex:1; cursor:pointer; font-family:var(--mono); font-size:11px; color:#c4d2e2;
  background:rgba(255,255,255,.07); border:1px solid rgba(140,170,200,.3);
  border-radius:7px; padding:9px 4px; transition:.15s; white-space:nowrap;
}
.qbtn:hover{color:#fff; border-color:#4d8bff; background:rgba(77,139,255,.2)}
.qbtn.hot:hover{color:#ff8a92; border-color:#ff6b72; background:rgba(255,56,69,.16)}

/* ---------- 警报弹窗 ---------- */
#alert{
  position:fixed; left:50%; top:44%; transform:translate(-50%,-50%) scale(.94); z-index:60;
  min-width:440px; max-width:88vw; padding:20px 32px 18px; border-radius:12px;
  background:rgba(255,255,255,0.94); border:1.5px solid var(--red);
  box-shadow:0 16px 60px rgba(160,30,40,0.35), 0 0 0 4px rgba(255,56,69,0.12);
  backdrop-filter:blur(10px); text-align:center;
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
}
#alert.show{opacity:1; transform:translate(-50%,-50%) scale(1); animation:flash2 .9s steps(1) 1}
@keyframes flash2{0%,100%{opacity:1}18%{opacity:.15}30%{opacity:1}48%{opacity:.15}60%{opacity:1}}
#alert h2{font-size:18px; color:var(--red); letter-spacing:1px; margin-bottom:7px}
#alert p{font-size:12px; color:var(--text-dim); font-family:var(--mono); letter-spacing:.5px}

/* ---------- modal ---------- */
#modal{
  position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center;
  background:rgba(20,35,55,0.4); backdrop-filter:blur(5px);
}
#modal.open{display:flex}
.modal-card{
  width:min(960px,94vw); max-height:88vh; display:flex; flex-direction:column;
  border-radius:12px; border:1px solid var(--border); background:#fbfdff;
  box-shadow:0 24px 80px rgba(20,40,70,0.35); overflow:hidden;
}
.m-head{display:flex; align-items:center; gap:10px; padding:13px 18px; border-bottom:1px solid var(--border); background:linear-gradient(180deg, rgba(220,232,245,.9), rgba(235,242,250,.9))}
.m-tabs{display:flex; gap:7px}
.m-tab{
  cursor:pointer; font-size:12px; padding:7px 15px; border-radius:7px; font-family:inherit;
  border:1px solid var(--border); color:var(--text-dim); background:var(--surface-2); font-weight:600;
}
.m-tab.on{color:#fff; border-color:var(--accent); background:var(--accent)}
.m-close{margin-left:auto; cursor:pointer; font-size:12px; color:var(--text-dim); background:var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:7px 13px; font-family:inherit}
.m-close:hover{color:var(--red); border-color:var(--red)}
.m-body{padding:18px 22px 22px; overflow-y:auto}
.m-body.hide{display:none}
.m-body h4{font-size:11px; color:var(--accent); letter-spacing:1.5px; margin:16px 0 8px; font-family:var(--mono)}
.m-body h4:first-child{margin-top:0}
table.spec{width:100%; border-collapse:collapse; font-size:12px}
table.spec th{
  text-align:left; font-size:10px; letter-spacing:1px; color:var(--text-dim); font-weight:600;
  border-bottom:1px solid var(--border); padding:6px 9px; font-family:var(--mono);
}
table.spec td{border-bottom:1px dashed rgba(100,140,200,0.2); padding:7px 9px; color:var(--text); line-height:1.6; vertical-align:top}
table.spec td:first-child{font-weight:600; white-space:nowrap; color:#33465c}
table.spec code{font-family:var(--mono); font-size:10.5px; color:var(--accent); background:rgba(45,107,204,0.08); border:1px solid rgba(45,107,204,0.2); border-radius:3px; padding:1px 5px}
table.spec .warn{color:var(--red)}
table.spec .ok{color:var(--green)}
</style>
</head>
<body>

<div id="header">
  <div class="icon-box">淬</div>
  <div>
    <h1>温敏相变导致 PET 猝灭</h1>
  </div>
</div>

<div id="main">
  <div id="simCard">
    <div class="card-head">
      <h3>微观动力学</h3>
    </div>
    <canvas id="sim"></canvas>
  </div>

  <div id="info-panel">
    <div class="panel">
      <h3>当前状态
        <span class="state-tag ok" id="stateTag">分散态 荧光 ON</span>
      </h3>
      <div class="panel-row"><span class="label">荧光强度 I/I₀</span><span class="value v-green" id="fVal">100.0 %</span></div>
      <div class="panel-row"><span class="label">核心—TNT 距离 D</span><span class="value v-blue" id="dVal">18.0 Å</span></div>
      <div class="panel-row"><span class="label">链回旋半径 R</span><span class="value v-blue" id="rVal">150 px</span></div>
    </div>
    <div class="panel" id="chartPanel">
      <h3>荧光信号监测 I / I₀
        <span class="state-tag" style="background:rgba(255,56,69,0.1); color:#ff3845">报警阈值 10%</span>
      </h3>
      <canvas id="chart"></canvas>
    </div>

    <div class="panel chat-card">
      <h3>DeepSeek 解答
        <span class="state-tag ds">离线推理</span>
      </h3>
      <div class="chat" id="chat"></div>
    </div>
  </div>
</div>

<div id="console">
  <div class="c-label">
    <div class="k">温度</div>
    <div class="v" id="tVal">25.0<u>℃</u></div>
  </div>
  <div class="sliderWrap">
    <div class="lcstMark" id="lcstMark"><span>LCST 32.0℃</span></div>
    <input type="range" id="tSlider" min="20" max="45" value="25" step="0.5">
    <div class="scaleRow"><span>20.0℃</span><span>32.5℃</span><span>45.0℃</span></div>
  </div>
  <div class="quick">
    <button class="qbtn" data-t="25">25.0℃ 分散</button>
    <button class="qbtn" data-t="31.5">31.5℃ 临界前</button>
    <button class="qbtn hot" data-t="38">38.0℃ 触发</button>
  </div>
</div>

<div id="alert">
  <h2>⚠ 警告：距离 &lt; 10 Å，PET 猝灭触发！</h2>
  <p id="alertDetail">T ≥ 32.0℃（LCST） D = -- Å I/I₀ = --%</p>
</div>

</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var clamp = function(v,a,b){ return Math.max(a, Math.min(b, v)); };
var lerp = function(a,b,t){ return a + (b-a)*t; };
var smooth = function(t){ return t*t*(3-2*t); };

/* ---------------- 状态 ---------------- */
var LCST = 32.0;
var PX_PER_A = 10;            // 10 px = 1 Å
var R0 = 150, R1 = 30;        // 链半径 px
var D0 = 180, D1 = 16;        // TNT 距离 px（180px=18Å → 16px=1.6Å）
var F_HI = 100, F_LO = 5;     // 荧光 %
var COLLAPSE_T = 0.5, QUENCH_T = 0.3, RECOVER_T = 1.2;

var S = { T: 25.0, col: 0, F: F_HI, t: 0 };

/* URL 直达：#hot = 38℃（动画触发） #hot2 = 38℃ 且直接定格猝灭态（录屏免等待） #cold = 25℃ */
(function(){
  var h = (location.hash || '').toLowerCase();
  if (h.indexOf('hot2') >= 0){ S.T = 38.0; S.col = 1; S.F = F_LO; }
  else if (h.indexOf('hot') >= 0) S.T = 38.0;
  else if (h.indexOf('cold') >= 0) S.T = 25.0;
})();

/* ---------------- 控制台 ---------------- */
var slider = $('tSlider'), tVal = $('tVal');
slider.value = S.T.toFixed(1);
function syncSlider(){
  var p = (S.T - 20) / (45 - 20) * 100;
  slider.style.setProperty('--p', p + '%');
  $('lcstMark').style.left = 'calc(' + ((LCST - 20) / 25 * 100) + '% - 1px)';
  tVal.innerHTML = S.T.toFixed(1) + '<u>℃</u>';
  tVal.classList.toggle('hot', S.T >= LCST);
}
slider.addEventListener('input', function(){ S.T = parseFloat(slider.value); syncSlider(); });
document.querySelectorAll('.qbtn').forEach(function(b){
  b.addEventListener('click', function(){ S.T = parseFloat(b.dataset.t); slider.value = S.T.toFixed(1); syncSlider(); });
});
syncSlider();

/* ---------------- 画布工具 ---------------- */
function fitCanvas(cv){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = cv.clientWidth || 600, h = cv.clientHeight || 400;
  if (cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  }
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { w:w, h:h, ctx:ctx };
}

/* ---------------- 主视窗 ---------------- */
var sim = $('sim');
var N_NODE = 9;
var tntSeeds = [];
for (var i = 0; i < 4; i++){
  tntSeeds.push({
    ang: -Math.PI/2 + i * (Math.PI*2/4) + (i%2 ? 0.35 : -0.3),
    ph: Math.random()*6.28
  });
}

function drawSim(){
  var f = fitCanvas(sim), ctx = f.ctx, w = f.w, h = f.h;
  ctx.clearRect(0,0,w,h);

  var cx = w*0.42, cy = h*0.52;
  var c = smooth(clamp(S.col,0,1));
  var R = lerp(R0, R1, c);
  var D = lerp(D0, D1, c);
  var glowK = S.F / F_HI;

  /* 背景细网格（浅色） */
  ctx.strokeStyle = 'rgba(80,120,170,.10)'; ctx.lineWidth = 1;
  var gs = 46;
  for (var gx = gs; gx < w; gx += gs){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,h); ctx.stroke(); }
  for (var gy = gs; gy < h; gy += gs){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke(); }

  /* 距离标尺圈 */
  ctx.setLineDash([4,6]);
  ctx.strokeStyle = 'rgba(45,107,204,.28)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, D0, 0, 7); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(90,106,122,.8)'; ctx.font = '10px "Times New Roman","Microsoft YaHei",serif';
  ctx.fillText('18 Å 参考圈', cx + D0*0.72, cy - D0*0.72);
  if (c > 0.5){
    ctx.strokeStyle = 'rgba(255,56,69,.4)';
    ctx.setLineDash([4,6]); ctx.beginPath(); ctx.arc(cx, cy, 20, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    if (c < 0.85){
      ctx.fillStyle = 'rgba(255,56,69,.85)';
      ctx.fillText('10 Å 警戒圈', cx + 26, cy - 26);
    }
  }

  /* PET 虚线 + 电子转移 */
  if (c > 0.55){
    var la = clamp((c - 0.55) / 0.35, 0, 1);
    tntSeeds.forEach(function(sd, idx){
      var p = tntPos(sd, cx, cy, D, c);
      ctx.save();
      ctx.globalAlpha = la * 0.9;
      ctx.setLineDash([5,5]);
      ctx.strokeStyle = 'rgba(255,56,69,.75)'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.setLineDash([]);
      for (var e = 0; e < 2; e++){
        var tt = ((S.t*0.9 + idx*0.27 + e*0.5) % 1);
        var ex = lerp(cx, p.x, tt), ey = lerp(cy, p.y, tt);
        ctx.globalAlpha = la * (1 - Math.abs(tt-0.5)*0.6);
        ctx.fillStyle = '#ff9944';
        ctx.shadowColor = 'rgba(255,153,68,.9)'; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.arc(ex, ey, 2.4, 0, 7); ctx.fill();
        ctx.shadowBlur = 0;
      }
      ctx.restore();
    });
  }

  /* 发光核光晕 */
  var coreR = R * 0.62;
  var halo = ctx.createRadialGradient(cx, cy, coreR*0.2, cx, cy, coreR + 30*glowK);
  halo.addColorStop(0, 'rgba(0,168,200,' + (0.30*glowK + 0.04) + ')');
  halo.addColorStop(1, 'rgba(0,168,200,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(cx, cy, coreR + 30*glowK + 14, 0, 7); ctx.fill();

  /* 聚合物波浪闭环链 */
  var pts = [];
  for (var n = 0; n < N_NODE; n++){
    var ang = n / N_NODE * Math.PI*2 + Math.sin(S.t*0.4)*0.05;
    var rr = R * (1 + 0.07*Math.sin(3*ang + S.t*1.3)) * (1 - 0.5*c*(Math.sin(5*ang+S.t*2)>0?0.18:0));
    pts.push({ x: cx + Math.cos(ang)*rr, y: cy + Math.sin(ang)*rr });
  }
  ctx.beginPath();
  pts.forEach(function(p, i){ i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
  ctx.closePath();
  ctx.strokeStyle = 'rgba(0,150,180,' + (0.35 + 0.45*glowK) + ')';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(0,168,200,' + (0.06 + 0.10*glowK) + ')';
  ctx.fill();
  /* 节点：亮青 → 熄灭灰蓝 */
  var nr = Math.round(lerp(90, 0, glowK));
  var ng = Math.round(lerp(120, 200, glowK));
  var nb = Math.round(lerp(140, 220, glowK));
  pts.forEach(function(p){
    ctx.beginPath(); ctx.arc(p.x, p.y, 5.2, 0, 7);
    ctx.fillStyle = 'rgb(' + nr + ',' + ng + ',' + nb + ')';
    ctx.shadowColor = 'rgba(0,190,220,' + (0.85*glowK) + ')'; ctx.shadowBlur = 14*glowK + 2;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.2; ctx.stroke();
  });
  /* 核心标签 */
  ctx.fillStyle = 'rgba(26,42,58,.9)'; ctx.font = '600 11px "Times New Roman","Microsoft YaHei",serif'; ctx.textAlign='center';
  ctx.fillText('发光核 聚合物链', cx, cy + R + 24);
  ctx.fillStyle = 'rgba(90,106,122,.9)'; ctx.font = '10px "Times New Roman","Microsoft YaHei",serif';
  ctx.fillText('R = ' + R.toFixed(0) + ' px', cx, cy + R + 38);
  ctx.textAlign='left';

  /* TNT 分子 */
  tntSeeds.forEach(function(sd){
    var p = tntPos(sd, cx, cy, D, c);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(sd.ang + Math.PI/2 + Math.sin(S.t*0.8 + sd.ph)*0.15);
    var s2 = 11;
    ctx.beginPath();
    ctx.moveTo(0, -s2); ctx.lineTo(s2*0.9, s2*0.75); ctx.lineTo(-s2*0.9, s2*0.75); ctx.closePath();
    ctx.fillStyle = 'rgba(255,56,69,.92)';
    ctx.shadowColor = 'rgba(255,56,69,.5)'; ctx.shadowBlur = 9;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  });
  ctx.fillStyle = 'rgba(255,56,69,.95)'; ctx.font = '600 10px "Times New Roman","Microsoft YaHei",serif'; ctx.textAlign='center';
  var tp = tntPos(tntSeeds[0], cx, cy, D, c);
  ctx.fillText('TNT', tp.x, tp.y - 22);
  ctx.textAlign='left';

  /* 距离标注（放下方，避免与顶部 TNT 标签重叠） */
  ctx.fillStyle = c > 0.85 ? 'rgba(255,56,69,.95)' : 'rgba(45,107,204,.95)';
  ctx.font = '600 11px "Times New Roman","Microsoft YaHei",serif'; ctx.textAlign = 'center';
  ctx.fillText('D = ' + (D / PX_PER_A).toFixed(1) + ' Å', cx, cy + D + 30);
  ctx.textAlign = 'left';
}
function tntPos(sd, cx, cy, D, c){
  var a = sd.ang + Math.sin(S.t*0.3 + sd.ph)*0.06;
  var jAmp = lerp(9, 2.5, c);
  var jx = Math.sin(S.t*1.7 + sd.ph*3) * jAmp;
  var jy = Math.cos(S.t*1.3 + sd.ph*2) * jAmp;
  return { x: cx + Math.cos(a)*D + jx, y: cy + Math.sin(a)*D + jy };
}

/* ---------------- 荧光图表 ---------------- */
var chart = $('chart');
var hist = [];
var HIST_WIN = 36;
/* 预填充：开场前 3 秒的当前值基线，避免初始曲线空白 */
for (var ht = -3; ht <= 0; ht += 0.25) hist.push({ t: ht, F: S.F });

function drawChart(){
  var f = fitCanvas(chart), ctx = f.ctx, w = f.w, h = f.h;
  ctx.clearRect(0,0,w,h);
  var pad = { l: 36, r: 10, t: 10, b: 18 };
  var X = function(t){ return pad.l + (t - (S.t - HIST_WIN)) / HIST_WIN * (w - pad.l - pad.r); };
  var Y = function(v){ return h - pad.b - v/100 * (h - pad.t - pad.b); };

  ctx.font = '9px "Times New Roman","Microsoft YaHei",serif';
  [0,25,50,75,100].forEach(function(v){
    ctx.strokeStyle = 'rgba(80,120,170,.14)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, Y(v)); ctx.lineTo(w-pad.r, Y(v)); ctx.stroke();
    ctx.fillStyle = 'rgba(90,106,122,.85)'; ctx.textAlign = 'right';
    ctx.fillText(v + '%', pad.l - 5, Y(v) + 3);
  });
  ctx.textAlign = 'left';

  /* 报警阈值线 10% */
  ctx.setLineDash([4,4]); ctx.strokeStyle = 'rgba(255,56,69,.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.l, Y(10)); ctx.lineTo(w-pad.r, Y(10)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,56,69,.9)';
  ctx.fillText('报警阈值 10%', pad.l + 5, Y(10) - 4);

  if (hist.length > 1){
    var grad = ctx.createLinearGradient(0, pad.t, 0, h - pad.b);
    grad.addColorStop(0, 'rgba(31,157,62,.20)'); grad.addColorStop(1, 'rgba(31,157,62,0)');
    ctx.beginPath();
    hist.forEach(function(pt, i){
      var x = X(pt.t), y = Y(pt.F);
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.strokeStyle = '#1f9d3e'; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.lineTo(X(hist[hist.length-1].t), Y(0)); ctx.lineTo(X(hist[0].t), Y(0)); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();

    /* 低于 10% 的段用红色重描 */
    ctx.beginPath();
    var inRed = false;
    for (var i = 0; i < hist.length; i++){
      var pt = hist[i];
      if (pt.F <= 10.5){
        if (!inRed && i > 0){ ctx.moveTo(X(hist[i-1].t), Y(hist[i-1].F)); inRed = true; }
        ctx.lineTo(X(pt.t), Y(pt.F));
      } else inRed = false;
    }
    ctx.strokeStyle = '#ff3845'; ctx.lineWidth = 2; ctx.stroke();

    var last = hist[hist.length-1];
    var quenched = last.F <= 10.5;
    ctx.beginPath(); ctx.arc(X(last.t), Y(last.F), 7, 0, 7);
    ctx.fillStyle = quenched ? 'rgba(255,56,69,.2)' : 'rgba(31,157,62,.2)'; ctx.fill();
    ctx.beginPath(); ctx.arc(X(last.t), Y(last.F), 3, 0, 7);
    ctx.fillStyle = quenched ? '#ff3845' : '#1f9d3e'; ctx.fill();
  }
}

/* ---------------- DeepSeek 解答（本地知识库，离线推理） ---------------- */
var QA = [
  {
    q: '温度在 32.0℃ 以下时，荧光为什么一直是亮的，探针不会误报？',
    lead: '因为发光核和检测对象在空间上是被隔开的，PET 通道没有接通。',
    points: [
      '聚合物链舒展，回旋半径 <em>R = 150 px</em>，TNT 距发光核 <em>D ≈ 18 Å</em>，远大于 <em>10 Å</em> 的 PET 临界距离。',
      '距离够远，光致电子转移通道断开，荧光团自由发光，<b>I/I₀ 稳定在 100%</b>，曲线平稳无波动。',
      'TNT 虽在做布朗运动，但始终在 18 Å 参考圈外游走，<b>不会误触发报警</b>。'
    ]
  },
  {
    q: '温度一越过 32.0℃，荧光为什么在 0.3 秒内断崖式熄灭？',
    lead: '链塌缩把 TNT 拉进了 10 Å 以内，PET 通道接通，荧光被猝灭。',
    points: [
      '温敏链 <b>0.5 s 内塌缩</b>：回旋半径 <em>R 150 → 30 px</em>，把 TNT 拽到 <em>D ≈ 1.6 Å</em>，小于临界距离。',
      '距离进入 10 Å 以内，光致电子从 TNT 转移进发光核，荧光 <b>0.3 s 断崖跌至 5%</b> 并变红报警。',
      '猝灭态稳定可驻留；降温后链重新舒展，<em>1.2 s 恢复到 100%</em>，<b>开关完全可逆</b>。'
    ]
  }
];
var qaTimers = [];
function stopQA(){ qaTimers.forEach(clearTimeout); qaTimers = []; }
function askDeepSeek(hot, instant){
  stopQA();
  var d = QA[hot ? 1 : 0];
  var chat = $('chat');
  if (!chat) return;
  var lisHtml = d.points.map(function(t){ return '<li>' + t + '</li>'; }).join('');
  chat.innerHTML =
    '<div class="q"><div class="qb">' + d.q + '</div></div>' +
    '<div class="a"><span class="ava">D</span><div class="ab">' +
      '<div class="think" id="think">正在推理<u></u><u></u><u></u></div>' +
      '<div id="ans">' +
        '<p class="lead">' + d.lead + '</p>' +
        '<ul>' + lisHtml + '</ul>' +
      '</div>' +
    '</div></div>';
  var ans = $('ans'), think = $('think');
  var lis = ans.getElementsByTagName('li');
  function done(){
    think.style.display = 'none';
    ans.style.display = 'block';
  }
  if (instant){
    done();
    for (var k = 0; k < lis.length; k++){
      lis[k].style.transition = 'none';
      lis[k].style.opacity = '1';
      lis[k].style.transform = 'none';
    }
    chat.scrollTop = 0;
    return;
  }
  ans.style.display = 'none';
  chat.scrollTop = 0;
  qaTimers.push(setTimeout(function(){
    done();
    for (var k = 0; k < lis.length; k++){
      (function(k){
        qaTimers.push(setTimeout(function(){ lis[k].classList.add('in'); }, 220 * k + 60));
      })(k);
    }
  }, 640));
}

/* ---------------- 读数 / 警报 ---------------- */
var alertEl = $('alert'), stateTag = $('stateTag');
var lastHot = null;
function updateHud(){
  var D = lerp(D0, D1, smooth(clamp(S.col,0,1)));
  var hot = S.T >= LCST;
  if (lastHot === null){ askDeepSeek(hot, true); lastHot = hot; }
  else if (hot !== lastHot){ askDeepSeek(hot, false); lastHot = hot; }
  var quenched = hot && S.F <= 10.5;

  $('fVal').textContent = S.F.toFixed(1) + ' %';
  $('fVal').className = 'value ' + (S.F <= 10.5 ? 'v-red' : 'v-green');
  $('dVal').textContent = (D / PX_PER_A).toFixed(1) + ' Å';
  $('dVal').className = 'value ' + (D < 20 ? 'v-red' : 'v-blue');
  $('rVal').textContent = lerp(R0, R1, smooth(clamp(S.col,0,1))).toFixed(0) + ' px';

  stateTag.className = 'state-tag ' + (quenched ? 'quench' : 'ok');
  stateTag.textContent = quenched ? '猝灭态 荧光 OFF' : '分散态 荧光 ON';

  if (quenched){
    $('alertDetail').textContent = 'T = ' + S.T.toFixed(1) + '℃（≥ LCST 32.0℃） D = ' + (D/PX_PER_A).toFixed(1) + ' Å（< 10 Å） I/I₀ = ' + S.F.toFixed(1) + '%';
    if (!alertEl.classList.contains('show')){
      alertEl.classList.remove('show'); void alertEl.offsetWidth;
      alertEl.classList.add('show');
    }
  } else {
    alertEl.classList.remove('show');
  }
}

/* ---------------- 主循环 ---------------- */
var last = performance.now(), histAcc = 0;
function loop(now){
  var dt = Math.min((now - last)/1000, 0.1); last = now;
  S.t += dt;
  var hot = S.T >= LCST;

  var dir = hot ? 1 : -1;
  var dur = hot ? COLLAPSE_T : 0.9;
  S.col = clamp(S.col + dir * dt / dur, 0, 1);
  var c = smooth(S.col);
  var D = lerp(D0, D1, c);

  var fTarget = (hot && D < 20) ? F_LO : F_HI;
  var fDur = fTarget < S.F ? QUENCH_T : RECOVER_T;
  S.F += clamp(fTarget - S.F, -fDur*100*dt, fDur*100*dt);
  if (Math.abs(fTarget - S.F) < 0.05) S.F = fTarget;

  histAcc += dt;
  if (histAcc > 0.12){
    histAcc = 0;
    hist.push({ t: S.t, F: S.F });
    while (hist.length && hist[0].t < S.t - HIST_WIN) hist.shift();
  }

  drawSim();
  drawChart();
  updateHud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
