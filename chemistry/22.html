<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>温敏相变 PET 猝灭演示台</title>
<style>
:root{
  --paper:#c6d6e5;
  --ink:#16273a;
  --ink2:#3a5269;
  --muted:#6d869e;
  --accent:#2d6bcc;
  --accent-l:#5ea8ff;
  --green:#1f9d3e;
  --red:#d63b3b;
  --amber:#c9861a;
  --line:rgba(45,107,204,.16);
  --card:rgba(255,255,255,.86);
  --dark:rgba(8,12,22,.9);
  --serif:"Times New Roman","Microsoft YaHei","PingFang SC","Hiragino Sans GB",Times,serif;
  --mono:var(--serif);
  --sans:var(--serif);
  /* 兼容旧变量名 */
  --bg:var(--paper); --surface:var(--card); --surface-2:rgba(255,255,255,.72);
  --border:var(--line); --text:var(--ink); --text-dim:var(--muted);
}
*{margin:0; padding:0; box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--sans); color:var(--ink); overflow:hidden;
  background:
    radial-gradient(1100px 600px at 18% -10%, #e7f0f9 0%, rgba(231,240,249,0) 62%),
    radial-gradient(900px 520px at 92% 108%, #b3c8dc 0%, rgba(179,200,220,0) 60%),
    var(--paper);
  display:flex; flex-direction:column; height:100vh; height:100dvh;
  user-select:none; -webkit-font-smoothing:antialiased;
}

/* ---------- header ---------- */
#header{
  flex:0 0 72px; height:72px; display:flex; align-items:center; gap:15px;
  padding:0 20px; z-index:10;
  background:linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.42));
  border-bottom:1px solid rgba(255,255,255,.85);
  backdrop-filter:blur(12px);
}
#header h1{font-size:20px; font-weight:600; color:var(--ink); letter-spacing:.02em; line-height:1.25}

/* ---------- layout ---------- */
#main{flex:1; display:flex; min-height:0; padding:14px 16px 10px; gap:14px}
#simCard{
  flex:1; min-width:0; position:relative; display:flex; flex-direction:column;
  border-radius:16px; overflow:hidden;
  background:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 10px 34px rgba(30,60,100,.13), inset 0 1px 0 rgba(255,255,255,.9);
}
.card-head{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:13px 20px; border-bottom:1px solid var(--line);
}
.card-head h3{
  display:flex; align-items:center; gap:10px;
  font-size:20px; font-weight:600; color:var(--ink); letter-spacing:.02em;
}
.card-head h3::before{
  content:''; width:4px; height:18px; border-radius:2px;
  background:linear-gradient(180deg,#2d6bcc,#67b0ff);
}
#sim{flex:1; width:100%; display:block; min-height:0; cursor:crosshair}

/* ---------- 右侧面板 ---------- */
#info-panel{flex:0 0 486px; width:486px; display:flex; flex-direction:column; gap:13px; min-height:0}
.panel{
  background:var(--card); border:1px solid rgba(255,255,255,.9);
  border-radius:14px; padding:20px 22px 22px;
  box-shadow:0 6px 22px rgba(30,60,100,.1);
  backdrop-filter:blur(8px);
}
.panel h3{
  display:flex; align-items:center; gap:10px;
  font-size:21px; font-weight:600; color:var(--ink);
  letter-spacing:.02em; margin-bottom:10px;
}
.panel h3::before{
  content:""; width:10px; height:10px; border-radius:50%; flex:0 0 10px;
  background:var(--accent); box-shadow:0 0 10px rgba(45,107,204,.65);
  transition:.3s;
}
.state-tag{
  margin-left:auto; font-family:var(--mono); font-size:13px; font-weight:400;
  letter-spacing:.03em; padding:4px 11px; border-radius:6px;
  border:1px solid rgba(45,107,204,.3); color:var(--accent);
  background:rgba(45,107,204,.07); white-space:nowrap;
}
.state-tag.ok{color:#1a8a38; border-color:rgba(31,157,62,.32); background:rgba(31,157,62,.07)}
.state-tag.quench{color:var(--red); border-color:rgba(214,59,59,.32); background:rgba(214,59,59,.07); animation:blinkTag 1.1s infinite}
.state-tag.warn{color:var(--red); border-color:rgba(214,59,59,.32); background:rgba(214,59,59,.07)}
.state-tag.ds{color:#4d6bfe; border-color:rgba(77,107,254,.32); background:rgba(77,107,254,.07); animation:none}
@keyframes blinkTag{0%,100%{opacity:1}50%{opacity:.45}}

.panel-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 0; font-size:16px; border-bottom:1px dashed rgba(45,107,204,.14);
}
.panel-row:last-child{border-bottom:none}
.panel-row .label{color:var(--muted); font-size:15px; letter-spacing:.02em}
.panel-row .value{
  font-family:var(--mono); font-weight:600; font-size:28px;
  line-height:1.15; font-variant-numeric:tabular-nums;
}
.v-green{color:var(--green)} .v-red{color:var(--red)} .v-blue{color:var(--accent)} .v-dim{color:var(--muted)}

#chartPanel{flex:0 0 268px; display:flex; flex-direction:column}
#chartPanel h3{margin-bottom:8px}
#chart{flex:1; width:100%; display:block; min-height:0}

/* ---------- DeepSeek 解答卡 ---------- */
.chat-card{flex:1; min-height:0; display:flex; flex-direction:column}
.chat{flex:1; min-height:0; overflow-y:auto; margin-top:10px; padding-right:3px}
.chat::-webkit-scrollbar{width:5px}
.chat::-webkit-scrollbar-thumb{background:rgba(77,107,254,.26); border-radius:3px}
.q{display:flex; justify-content:flex-end; margin-bottom:11px}
.qb{
  max-width:94%; font-size:15px; line-height:1.6; color:var(--ink);
  background:rgba(45,107,204,.10); border:1px solid rgba(45,107,204,.2);
  border-radius:13px 13px 4px 13px; padding:8px 12px;
}
.a{display:flex; gap:9px; align-items:flex-start}
.ava{
  width:25px; height:25px; flex:0 0 25px; border-radius:8px; margin-top:1px;
  display:grid; place-items:center; color:#fff; font-size:12.5px; font-weight:700;
  font-family:var(--mono);
  background:linear-gradient(135deg,#4d6bfe,#8aa2ff);
  box-shadow:0 3px 10px rgba(77,107,254,.3);
}
.ab{flex:1; min-width:0}
.ab .lead{font-size:15px; line-height:1.6; color:var(--ink); font-weight:500}
.ab ul{list-style:none; margin-top:8px; display:flex; flex-direction:column; gap:7px}
.ab li{
  font-size:14.5px; line-height:1.62; color:var(--ink2); padding-left:16px; position:relative;
  opacity:0; transform:translateY(5px); transition:opacity .3s, transform .3s;
}
.ab li.in{opacity:1; transform:none}
.ab li::before{
  content:""; position:absolute; left:0; top:8px; width:5.5px; height:5.5px; border-radius:50%;
  background:#4d6bfe;
}
.ab b{color:var(--ink); font-weight:600}
.ab em{font-style:normal; color:#3a56e8; font-weight:600}
.think{display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--muted); font-family:var(--mono)}
.think u{text-decoration:none; width:4px; height:4px; border-radius:50%; background:#4d6bfe; display:inline-block; animation:tb 1.1s infinite}
.think u:nth-child(2){animation-delay:.2s}
.think u:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{opacity:.25; transform:translateY(0)}30%{opacity:1; transform:translateY(-2px)}}

/* ---------- 底部深色控制条 ---------- */
#console{
  flex:0 0 auto; display:flex; align-items:center; gap:24px;
  padding:12px 20px 14px; background:var(--dark);
  border-top:1px solid rgba(120,170,230,.2);
  box-shadow:0 -8px 30px rgba(10,25,45,.22); z-index:10;
}
.c-label{min-width:118px}
.c-label .k{font-family:var(--mono); font-size:12.5px; letter-spacing:.14em; color:#8ba3bb; margin-bottom:2px}
.c-label .v{font-family:var(--mono); font-size:30px; font-weight:600; color:#e6f0fa; font-variant-numeric:tabular-nums; line-height:1.1}
.c-label .v u{text-decoration:none; font-size:14px; color:#8ba3bb; margin-left:4px; font-weight:400}
.c-label .v.hot{color:#e0605a; text-shadow:0 0 18px rgba(214,59,59,.5)}
.sliderWrap{flex:1; position:relative; padding-top:14px}
#tSlider{-webkit-appearance:none; appearance:none; width:100%; height:20px; background:transparent; cursor:pointer; outline:none; display:block}
#tSlider::-webkit-slider-runnable-track{
  height:4px; border-radius:2px;
  background:linear-gradient(90deg,#5ea8ff 0 var(--p,20%),rgba(255,255,255,.16) var(--p,20%) 100%);
}
#tSlider::-webkit-slider-thumb{
  -webkit-appearance:none; width:14px; height:14px; border-radius:50%; margin-top:-5px;
  background:#fff; border:2px solid #3f8ae0; box-shadow:0 2px 8px rgba(0,0,0,.4);
}
#tSlider::-moz-range-track{height:4px; border-radius:2px; background:rgba(255,255,255,.16)}
#tSlider::-moz-range-progress{height:4px; border-radius:2px; background:#5ea8ff}
#tSlider::-moz-range-thumb{width:13px; height:13px; border-radius:50%; background:#fff; border:2px solid #3f8ae0}
.lcstMark{position:absolute; top:2px; bottom:-6px; width:0; pointer-events:none; border-left:2px dashed rgba(214,59,59,.7); opacity:.95}
.lcstMark span{position:absolute; top:-13px; left:-32px; font-family:var(--mono); font-size:11.5px; color:#e08a8a; white-space:nowrap; letter-spacing:.04em}
.scaleRow{display:flex; justify-content:space-between; margin-top:7px; font-family:var(--mono); font-size:11.5px; color:#8ba3bb}
.quick{display:flex; gap:6px; min-width:246px}
.qbtn{
  flex:1; cursor:pointer; font-family:var(--mono); font-size:13px; letter-spacing:.02em;
  color:#a8bed4; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
  border-radius:8px; padding:9px 6px; transition:.16s; white-space:nowrap;
}
.qbtn:hover{color:#fff; border-color:rgba(94,168,255,.55); background:rgba(94,168,255,.16)}
.qbtn.hot:hover{color:#e8a8a8; border-color:rgba(214,59,59,.6); background:rgba(214,59,59,.16)}

/* ---------- 警报弹窗 ---------- */
#alert{
  position:fixed; left:50%; top:44%; transform:translate(-50%,-50%) scale(.94); z-index:60;
  min-width:470px; max-width:88vw; padding:22px 34px 20px; border-radius:14px;
  background:rgba(255,255,255,.95); border:1px solid rgba(214,59,59,.7);
  box-shadow:0 18px 60px rgba(120,30,40,.28), 0 0 0 4px rgba(214,59,59,.09);
  backdrop-filter:blur(10px); text-align:center;
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
}
#alert.show{opacity:1; transform:translate(-50%,-50%) scale(1); animation:flash2 .9s steps(1) 1}
@keyframes flash2{0%,100%{opacity:1}18%{opacity:.15}30%{opacity:1}48%{opacity:.15}60%{opacity:1}}
#alert h2{font-size:21px; font-weight:600; color:var(--red); letter-spacing:.02em; margin-bottom:8px}
#alert p{font-size:13px; color:var(--muted); font-family:var(--mono); letter-spacing:.03em}

#toast{
  position:fixed; left:50%; bottom:96px; transform:translate(-50%,10px); z-index:80;
  padding:10px 20px; border-radius:22px; font-size:13.5px; color:var(--ink);
  background:rgba(255,255,255,.97); border:1px solid var(--accent);
  box-shadow:0 8px 26px rgba(16,40,70,.25);
  opacity:0; pointer-events:none; transition:.28s;
}
#toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:1400px){
  #info-panel{flex-basis:430px; width:430px}
  #header h1{font-size:18px}
}
</style>
</head>
<body>

<div id="header">
  <div class="ttl">
    <h1>温敏相变导致 PET 猝灭</h1>
  </div>
</div>

<div id="main">
  <div id="simCard">
    <div class="card-head">
      <h3>微观动力学</h3>
    </div>
    <canvas id="sim"></canvas>
  </div>

  <div id="info-panel">
    <div class="panel">
      <h3>当前状态
        <span class="state-tag ok" id="stateTag">分散态 荧光 ON</span>
      </h3>
      <div class="panel-row"><span class="label">荧光强度 I/I₀</span><span class="value v-green" id="fVal">100.0 %</span></div>
      <div class="panel-row"><span class="label">核心—TNT 距离 D</span><span class="value v-blue" id="dVal">18.0 Å</span></div>
      <div class="panel-row"><span class="label">链回旋半径 R</span><span class="value v-blue" id="rVal">150 px</span></div>
    </div>
    <div class="panel" id="chartPanel">
      <h3>荧光信号监测 I / I₀
        <span class="state-tag warn">报警阈值 10%</span>
      </h3>
      <canvas id="chart"></canvas>
    </div>

    <div class="panel chat-card">
      <h3>DeepSeek 解答
        <span class="state-tag ds">离线推理</span>
      </h3>
      <div class="chat" id="chat"></div>
    </div>
  </div>
</div>

<div id="console">
  <div class="c-label">
    <div class="k">温度</div>
    <div class="v" id="tVal">25.0<u>℃</u></div>
  </div>
  <div class="sliderWrap">
    <div class="lcstMark" id="lcstMark"><span>LCST 32.0℃</span></div>
    <input type="range" id="tSlider" min="20" max="45" value="25" step="0.5">
    <div class="scaleRow"><span>20.0℃</span><span>32.5℃</span><span>45.0℃</span></div>
  </div>
  <div class="quick">
    <button class="qbtn" data-t="25">25.0℃ 分散</button>
    <button class="qbtn" data-t="31.5">31.5℃ 临界前</button>
    <button class="qbtn hot" data-t="38">38.0℃ 触发</button>
  </div>
</div>

<div id="alert">
  <h2>⚠ 警告：距离 &lt; 10 Å，PET 猝灭触发！</h2>
  <p id="alertDetail">T ≥ 32.0℃（LCST） D = -- Å I/I₀ = --%</p>
</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var clamp = function(v,a,b){ return Math.max(a, Math.min(b, v)); };
var lerp = function(a,b,t){ return a + (b-a)*t; };
var smooth = function(t){ return t*t*(3-2*t); };

/* ---------------- 状态 ---------------- */
var LCST = 32.0;
var PX_PER_A = 10;            // 10 px = 1 Å
var R0 = 150, R1 = 30;        // 链半径 px
var D0 = 180, D1 = 16;        // TNT 距离 px（180px=18Å → 16px=1.6Å）
var F_HI = 100, F_LO = 5;     // 荧光 %
var COLLAPSE_T = 0.5, QUENCH_T = 0.3, RECOVER_T = 1.2;

var S = { T: 25.0, col: 0, F: F_HI, t: 0 };

/* URL 直达：#hot = 38℃（动画触发） #hot2 = 38℃ 且直接定格猝灭态（录屏免等待） #cold = 25℃ */
(function(){
  var h = (location.hash || '').toLowerCase();
  if (h.indexOf('hot2') >= 0){ S.T = 38.0; S.col = 1; S.F = F_LO; }
  else if (h.indexOf('hot') >= 0) S.T = 38.0;
  else if (h.indexOf('cold') >= 0) S.T = 25.0;
})();

/* ---------------- 控制台 ---------------- */
var slider = $('tSlider'), tVal = $('tVal');
slider.value = S.T.toFixed(1);
function syncSlider(){
  var p = (S.T - 20) / (45 - 20) * 100;
  slider.style.setProperty('--p', p + '%');
  $('lcstMark').style.left = 'calc(' + ((LCST - 20) / 25 * 100) + '% - 1px)';
  tVal.innerHTML = S.T.toFixed(1) + '<u>℃</u>';
  tVal.classList.toggle('hot', S.T >= LCST);
}
slider.addEventListener('input', function(){ S.T = parseFloat(slider.value); syncSlider(); });
document.querySelectorAll('.qbtn').forEach(function(b){
  b.addEventListener('click', function(){ S.T = parseFloat(b.dataset.t); slider.value = S.T.toFixed(1); syncSlider(); });
});
syncSlider();

/* ---------------- 画布工具 ---------------- */
function fitCanvas(cv){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = cv.clientWidth || 600, h = cv.clientHeight || 400;
  if (cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  }
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { w:w, h:h, ctx:ctx };
}

/* ---------------- 主视窗 ---------------- */
var sim = $('sim');
var N_NODE = 9;
var tntSeeds = [];
for (var i = 0; i < 4; i++){
  tntSeeds.push({
    ang: -Math.PI/2 + i * (Math.PI*2/4) + (i%2 ? 0.35 : -0.3),
    ph: Math.random()*6.28
  });
}

function drawSim(){
  var f = fitCanvas(sim), ctx = f.ctx, w = f.w, h = f.h;
  ctx.clearRect(0,0,w,h);

  var cx = w*0.42, cy = h*0.52;
  var c = smooth(clamp(S.col,0,1));
  var R = lerp(R0, R1, c);
  var D = lerp(D0, D1, c);
  var glowK = S.F / F_HI;

  /* 背景细网格（浅色） */
  ctx.strokeStyle = 'rgba(45,107,204,.055)'; ctx.lineWidth = 1;
  var gs = 46;
  for (var gx = gs; gx < w; gx += gs){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,h); ctx.stroke(); }
  for (var gy = gs; gy < h; gy += gs){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke(); }

  /* 距离标尺圈 */
  ctx.setLineDash([4,6]);
  ctx.strokeStyle = 'rgba(45,107,204,.28)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, D0, 0, 7); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(109,134,158,.8)'; ctx.font = '10px "Times New Roman","Microsoft YaHei",serif';
  ctx.fillText('18 Å 参考圈', cx + D0*0.72, cy - D0*0.72);
  if (c > 0.5){
    ctx.strokeStyle = 'rgba(214,59,59,.4)';
    ctx.setLineDash([4,6]); ctx.beginPath(); ctx.arc(cx, cy, 20, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    if (c < 0.85){
      ctx.fillStyle = 'rgba(214,59,59,.85)';
      ctx.fillText('10 Å 警戒圈', cx + 26, cy - 26);
    }
  }

  /* PET 虚线 + 电子转移 */
  if (c > 0.55){
    var la = clamp((c - 0.55) / 0.35, 0, 1);
    tntSeeds.forEach(function(sd, idx){
      var p = tntPos(sd, cx, cy, D, c);
      ctx.save();
      ctx.globalAlpha = la * 0.9;
      ctx.setLineDash([5,5]);
      ctx.strokeStyle = 'rgba(214,59,59,.75)'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.setLineDash([]);
      for (var e = 0; e < 2; e++){
        var tt = ((S.t*0.9 + idx*0.27 + e*0.5) % 1);
        var ex = lerp(cx, p.x, tt), ey = lerp(cy, p.y, tt);
        ctx.globalAlpha = la * (1 - Math.abs(tt-0.5)*0.6);
        ctx.fillStyle = '#e0912f';
        ctx.shadowColor = 'rgba(224,145,47,.9)'; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.arc(ex, ey, 2.4, 0, 7); ctx.fill();
        ctx.shadowBlur = 0;
      }
      ctx.restore();
    });
  }

  /* 发光核光晕 */
  var coreR = R * 0.62;
  var halo = ctx.createRadialGradient(cx, cy, coreR*0.2, cx, cy, coreR + 30*glowK);
  halo.addColorStop(0, 'rgba(0,168,200,' + (0.30*glowK + 0.04) + ')');
  halo.addColorStop(1, 'rgba(0,168,200,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(cx, cy, coreR + 30*glowK + 14, 0, 7); ctx.fill();

  /* 聚合物波浪闭环链 */
  var pts = [];
  for (var n = 0; n < N_NODE; n++){
    var ang = n / N_NODE * Math.PI*2 + Math.sin(S.t*0.4)*0.05;
    var rr = R * (1 + 0.07*Math.sin(3*ang + S.t*1.3)) * (1 - 0.5*c*(Math.sin(5*ang+S.t*2)>0?0.18:0));
    pts.push({ x: cx + Math.cos(ang)*rr, y: cy + Math.sin(ang)*rr });
  }
  ctx.beginPath();
  pts.forEach(function(p, i){ i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
  ctx.closePath();
  ctx.strokeStyle = 'rgba(0,150,180,' + (0.35 + 0.45*glowK) + ')';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(0,168,200,' + (0.06 + 0.10*glowK) + ')';
  ctx.fill();
  /* 节点：亮青 → 熄灭灰蓝 */
  var nr = Math.round(lerp(90, 0, glowK));
  var ng = Math.round(lerp(120, 200, glowK));
  var nb = Math.round(lerp(140, 220, glowK));
  pts.forEach(function(p){
    ctx.beginPath(); ctx.arc(p.x, p.y, 5.2, 0, 7);
    ctx.fillStyle = 'rgb(' + nr + ',' + ng + ',' + nb + ')';
    ctx.shadowColor = 'rgba(0,190,220,' + (0.85*glowK) + ')'; ctx.shadowBlur = 14*glowK + 2;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.2; ctx.stroke();
  });
  /* 核心标签 */
  ctx.fillStyle = 'rgba(22,39,58,.9)'; ctx.font = '600 11px "Times New Roman","Microsoft YaHei",serif'; ctx.textAlign='center';
  ctx.fillText('发光核 聚合物链', cx, cy + R + 24);
  ctx.fillStyle = 'rgba(109,134,158,.9)'; ctx.font = '10px "Times New Roman","Microsoft YaHei",serif';
  ctx.fillText('R = ' + R.toFixed(0) + ' px', cx, cy + R + 38);
  ctx.textAlign='left';

  /* TNT 分子 */
  tntSeeds.forEach(function(sd){
    var p = tntPos(sd, cx, cy, D, c);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(sd.ang + Math.PI/2 + Math.sin(S.t*0.8 + sd.ph)*0.15);
    var s2 = 11;
    ctx.beginPath();
    ctx.moveTo(0, -s2); ctx.lineTo(s2*0.9, s2*0.75); ctx.lineTo(-s2*0.9, s2*0.75); ctx.closePath();
    ctx.fillStyle = 'rgba(214,59,59,.92)';
    ctx.shadowColor = 'rgba(214,59,59,.5)'; ctx.shadowBlur = 9;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  });
  ctx.fillStyle = 'rgba(214,59,59,.95)'; ctx.font = '600 10px "Times New Roman","Microsoft YaHei",serif'; ctx.textAlign='center';
  var tp = tntPos(tntSeeds[0], cx, cy, D, c);
  ctx.fillText('TNT', tp.x, tp.y - 22);
  ctx.textAlign='left';

  /* 距离标注（放下方，避免与顶部 TNT 标签重叠） */
  ctx.fillStyle = c > 0.85 ? 'rgba(214,59,59,.95)' : 'rgba(45,107,204,.95)';
  ctx.font = '600 11px "Times New Roman","Microsoft YaHei",serif'; ctx.textAlign = 'center';
  ctx.fillText('D = ' + (D / PX_PER_A).toFixed(1) + ' Å', cx, cy + D + 30);
  ctx.textAlign = 'left';
}
function tntPos(sd, cx, cy, D, c){
  var a = sd.ang + Math.sin(S.t*0.3 + sd.ph)*0.06;
  var jAmp = lerp(9, 2.5, c);
  var jx = Math.sin(S.t*1.7 + sd.ph*3) * jAmp;
  var jy = Math.cos(S.t*1.3 + sd.ph*2) * jAmp;
  return { x: cx + Math.cos(a)*D + jx, y: cy + Math.sin(a)*D + jy };
}

/* ---------------- 荧光图表 ---------------- */
var chart = $('chart');
var hist = [];
var HIST_WIN = 36;
/* 预填充：开场前 3 秒的当前值基线，避免初始曲线空白 */
for (var ht = -3; ht <= 0; ht += 0.25) hist.push({ t: ht, F: S.F });

function drawChart(){
  var f = fitCanvas(chart), ctx = f.ctx, w = f.w, h = f.h;
  ctx.clearRect(0,0,w,h);
  var pad = { l: 36, r: 10, t: 10, b: 18 };
  var X = function(t){ return pad.l + (t - (S.t - HIST_WIN)) / HIST_WIN * (w - pad.l - pad.r); };
  var Y = function(v){ return h - pad.b - v/100 * (h - pad.t - pad.b); };

  ctx.font = '9px "Times New Roman","Microsoft YaHei",serif';
  [0,25,50,75,100].forEach(function(v){
    ctx.strokeStyle = 'rgba(45,107,204,.10)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, Y(v)); ctx.lineTo(w-pad.r, Y(v)); ctx.stroke();
    ctx.fillStyle = 'rgba(109,134,158,.85)'; ctx.textAlign = 'right';
    ctx.fillText(v + '%', pad.l - 5, Y(v) + 3);
  });
  ctx.textAlign = 'left';

  /* 报警阈值线 10% */
  ctx.setLineDash([4,4]); ctx.strokeStyle = 'rgba(214,59,59,.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.l, Y(10)); ctx.lineTo(w-pad.r, Y(10)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(214,59,59,.9)';
  ctx.fillText('报警阈值 10%', pad.l + 5, Y(10) - 4);

  if (hist.length > 1){
    var grad = ctx.createLinearGradient(0, pad.t, 0, h - pad.b);
    grad.addColorStop(0, 'rgba(31,157,62,.20)'); grad.addColorStop(1, 'rgba(31,157,62,0)');
    ctx.beginPath();
    hist.forEach(function(pt, i){
      var x = X(pt.t), y = Y(pt.F);
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.strokeStyle = '#1f9d3e'; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.lineTo(X(hist[hist.length-1].t), Y(0)); ctx.lineTo(X(hist[0].t), Y(0)); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();

    /* 低于 10% 的段用红色重描 */
    ctx.beginPath();
    var inRed = false;
    for (var i = 0; i < hist.length; i++){
      var pt = hist[i];
      if (pt.F <= 10.5){
        if (!inRed && i > 0){ ctx.moveTo(X(hist[i-1].t), Y(hist[i-1].F)); inRed = true; }
        ctx.lineTo(X(pt.t), Y(pt.F));
      } else inRed = false;
    }
    ctx.strokeStyle = '#d63b3b'; ctx.lineWidth = 2; ctx.stroke();

    var last = hist[hist.length-1];
    var quenched = last.F <= 10.5;
    ctx.beginPath(); ctx.arc(X(last.t), Y(last.F), 7, 0, 7);
    ctx.fillStyle = quenched ? 'rgba(214,59,59,.2)' : 'rgba(31,157,62,.2)'; ctx.fill();
    ctx.beginPath(); ctx.arc(X(last.t), Y(last.F), 3, 0, 7);
    ctx.fillStyle = quenched ? '#d63b3b' : '#1f9d3e'; ctx.fill();
  }
}

/* ---------------- DeepSeek 解答（本地知识库，离线推理） ---------------- */
var QA = [
  {
    q: '温度在 32.0℃ 以下时，荧光为什么一直是亮的，探针不会误报？',
    lead: '因为发光核和检测对象在空间上是被隔开的，PET 通道没有接通。',
    points: [
      '聚合物链舒展，回旋半径 <em>R = 150 px</em>，TNT 距发光核 <em>D ≈ 18 Å</em>，远大于 <em>10 Å</em> 的 PET 临界距离。',
      '距离够远，光致电子转移通道断开，荧光团自由发光，<b>I/I₀ 稳定在 100%</b>，曲线平稳无波动。',
      'TNT 虽在做布朗运动，但始终在 18 Å 参考圈外游走，<b>不会误触发报警</b>。'
    ]
  },
  {
    q: '温度一越过 32.0℃，荧光为什么在 0.3 秒内断崖式熄灭？',
    lead: '链塌缩把 TNT 拉进了 10 Å 以内，PET 通道接通，荧光被猝灭。',
    points: [
      '温敏链 <b>0.5 s 内塌缩</b>：回旋半径 <em>R 150 → 30 px</em>，把 TNT 拽到 <em>D ≈ 1.6 Å</em>，小于临界距离。',
      '距离进入 10 Å 以内，光致电子从 TNT 转移进发光核，荧光 <b>0.3 s 断崖跌至 5%</b> 并变红报警。',
      '猝灭态稳定可驻留；降温后链重新舒展，<em>1.2 s 恢复到 100%</em>，<b>开关完全可逆</b>。'
    ]
  }
];
var qaTimers = [];
function stopQA(){ qaTimers.forEach(clearTimeout); qaTimers = []; }
function askDeepSeek(hot, instant){
  stopQA();
  var d = QA[hot ? 1 : 0];
  var chat = $('chat');
  if (!chat) return;
  var lisHtml = d.points.map(function(t){ return '<li>' + t + '</li>'; }).join('');
  chat.innerHTML =
    '<div class="q"><div class="qb">' + d.q + '</div></div>' +
    '<div class="a"><span class="ava">D</span><div class="ab">' +
      '<div class="think" id="think">正在推理<u></u><u></u><u></u></div>' +
      '<div id="ans">' +
        '<p class="lead">' + d.lead + '</p>' +
        '<ul>' + lisHtml + '</ul>' +
      '</div>' +
    '</div></div>';
  var ans = $('ans'), think = $('think');
  var lis = ans.getElementsByTagName('li');
  function done(){
    think.style.display = 'none';
    ans.style.display = 'block';
  }
  if (instant){
    done();
    for (var k = 0; k < lis.length; k++){
      lis[k].style.transition = 'none';
      lis[k].style.opacity = '1';
      lis[k].style.transform = 'none';
    }
    chat.scrollTop = 0;
    return;
  }
  ans.style.display = 'none';
  chat.scrollTop = 0;
  qaTimers.push(setTimeout(function(){
    done();
    for (var k = 0; k < lis.length; k++){
      (function(k){
        qaTimers.push(setTimeout(function(){ lis[k].classList.add('in'); }, 220 * k + 60));
      })(k);
    }
  }, 640));
}

/* ---------------- 读数 / 警报 ---------------- */
var alertEl = $('alert'), stateTag = $('stateTag');
var lastHot = null;
function updateHud(){
  var D = lerp(D0, D1, smooth(clamp(S.col,0,1)));
  var hot = S.T >= LCST;
  if (lastHot === null){ askDeepSeek(hot, true); lastHot = hot; }
  else if (hot !== lastHot){ askDeepSeek(hot, false); lastHot = hot; }
  var quenched = hot && S.F <= 10.5;

  $('fVal').textContent = S.F.toFixed(1) + ' %';
  $('fVal').className = 'value ' + (S.F <= 10.5 ? 'v-red' : 'v-green');
  $('dVal').textContent = (D / PX_PER_A).toFixed(1) + ' Å';
  $('dVal').className = 'value ' + (D < 20 ? 'v-red' : 'v-blue');
  $('rVal').textContent = lerp(R0, R1, smooth(clamp(S.col,0,1))).toFixed(0) + ' px';

  stateTag.className = 'state-tag ' + (quenched ? 'quench' : 'ok');
  stateTag.textContent = quenched ? '猝灭态 荧光 OFF' : '分散态 荧光 ON';

  if (quenched){
    $('alertDetail').textContent = 'T = ' + S.T.toFixed(1) + '℃（≥ LCST 32.0℃） D = ' + (D/PX_PER_A).toFixed(1) + ' Å（< 10 Å） I/I₀ = ' + S.F.toFixed(1) + '%';
    if (!alertEl.classList.contains('show')){
      alertEl.classList.remove('show'); void alertEl.offsetWidth;
      alertEl.classList.add('show');
    }
  } else {
    alertEl.classList.remove('show');
  }
}

/* ---------------- 主循环 ---------------- */
var last = performance.now(), histAcc = 0;
function loop(now){
  var dt = Math.min((now - last)/1000, 0.1); last = now;
  S.t += dt;
  var hot = S.T >= LCST;

  var dir = hot ? 1 : -1;
  var dur = hot ? COLLAPSE_T : 0.9;
  S.col = clamp(S.col + dir * dt / dur, 0, 1);
  var c = smooth(S.col);
  var D = lerp(D0, D1, c);

  var fTarget = (hot && D < 20) ? F_LO : F_HI;
  var fDur = fTarget < S.F ? QUENCH_T : RECOVER_T;
  S.F += clamp(fTarget - S.F, -fDur*100*dt, fDur*100*dt);
  if (Math.abs(fTarget - S.F) < 0.05) S.F = fTarget;

  histAcc += dt;
  if (histAcc > 0.12){
    histAcc = 0;
    hist.push({ t: S.t, F: S.F });
    while (hist.length && hist[0].t < S.t - HIST_WIN) hist.shift();
  }

  drawSim();
  drawChart();
  updateHud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
